<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" width="860" height="600">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="600" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="36" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Integração com o Sistema Completo — Fluxo Final</text>

  <!-- Helper macro: box centered at cx, starting at y, width w, height h -->
  <!-- Step 1: Frontend React -->
  <rect x="280" y="54" width="300" height="44" rx="10" fill="white" stroke="#3b82f6" stroke-width="2" filter="url(#sh)"/>
  <rect x="280" y="54" width="300" height="44" rx="10" fill="#3b82f6" opacity="0.1"/>
  <rect x="280" y="54" width="6" height="44" rx="3" fill="#3b82f6"/>
  <text x="430" y="73" font-family="system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1e40af">🖥️  Frontend React</text>
  <text x="430" y="89" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Captura frame via webcam · Porta 5173</text>

  <path d="M 430 98 L 430 112" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Step 2: Backend Node.js -->
  <rect x="280" y="112" width="300" height="44" rx="10" fill="white" stroke="#16a34a" stroke-width="2" filter="url(#sh)"/>
  <rect x="280" y="112" width="300" height="44" rx="10" fill="#16a34a" opacity="0.08"/>
  <rect x="280" y="112" width="6" height="44" rx="3" fill="#16a34a"/>
  <text x="430" y="131" font-family="system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#15803d">⚙️  Backend Node.js</text>
  <text x="430" y="147" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle" fill="#64748b">POST /api/reconhecimento/validar · Porta 3000</text>

  <path d="M 430 156 L 430 170" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Step 3: API Python -->
  <rect x="280" y="170" width="300" height="44" rx="10" fill="white" stroke="#f59e0b" stroke-width="2" filter="url(#sh)"/>
  <rect x="280" y="170" width="300" height="44" rx="10" fill="#f59e0b" opacity="0.08"/>
  <rect x="280" y="170" width="6" height="44" rx="3" fill="#f59e0b"/>
  <text x="430" y="189" font-family="system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#b45309">🤖  API Python</text>
  <text x="430" y="205" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle" fill="#64748b">POST /recognize-multiple · FastAPI · Porta 8000</text>

  <path d="M 430 214 L 430 228" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Step 4: buffalo_s -->
  <rect x="280" y="228" width="300" height="44" rx="10" fill="white" stroke="#b45309" stroke-width="2" filter="url(#sh)"/>
  <rect x="280" y="228" width="300" height="44" rx="10" fill="#b45309" opacity="0.08"/>
  <rect x="280" y="228" width="6" height="44" rx="3" fill="#b45309"/>
  <text x="430" y="247" font-family="system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">🧠  InsightFace buffalo_s</text>
  <text x="430" y="263" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Detecta rostos · Extrai embedding 512-dim</text>

  <path d="M 430 272 L 430 286" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Step 5: Firebase alunos -->
  <rect x="280" y="286" width="300" height="44" rx="10" fill="white" stroke="#ea580c" stroke-width="2" filter="url(#sh)"/>
  <rect x="280" y="286" width="300" height="44" rx="10" fill="#ea580c" opacity="0.08"/>
  <rect x="280" y="286" width="6" height="44" rx="3" fill="#ea580c"/>
  <text x="430" y="305" font-family="system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#c2410c">☁️  Firebase — alunos</text>
  <text x="430" y="321" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Busca embeddings cadastrados do aluno</text>

  <path d="M 430 330 L 430 344" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Step 6: Comparação cosine similarity -->
  <rect x="280" y="344" width="300" height="44" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2" filter="url(#sh)"/>
  <rect x="280" y="344" width="300" height="44" rx="10" fill="#8b5cf6" opacity="0.08"/>
  <rect x="280" y="344" width="6" height="44" rx="3" fill="#8b5cf6"/>
  <text x="430" y="363" font-family="system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#6d28d9">⚡  Comparação — cosine similarity</text>
  <text x="430" y="379" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Embedding vs. cadastro · NumPy · limiar 0.35</text>

  <path d="M 430 388 L 430 402" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Step 7: retorna matricula -->
  <rect x="280" y="402" width="300" height="44" rx="10" fill="white" stroke="#16a34a" stroke-width="2" filter="url(#sh)"/>
  <rect x="280" y="402" width="300" height="44" rx="10" fill="#16a34a" opacity="0.08"/>
  <rect x="280" y="402" width="6" height="44" rx="3" fill="#16a34a"/>
  <text x="430" y="421" font-family="system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#15803d">📋  Retorna matrícula + confiança</text>
  <text x="430" y="437" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle" fill="#64748b">API retorna { matricula, nome, confidence }</text>

  <path d="M 430 446 L 430 460" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Step 8: Backend busca aluno + verifica janela -->
  <rect x="280" y="460" width="300" height="56" rx="10" fill="white" stroke="#16a34a" stroke-width="2" filter="url(#sh)"/>
  <rect x="280" y="460" width="300" height="56" rx="10" fill="#16a34a" opacity="0.08"/>
  <rect x="280" y="460" width="6" height="56" rx="3" fill="#16a34a"/>
  <text x="430" y="479" font-family="system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#15803d">⚙️  Backend — busca aluno</text>
  <text x="430" y="495" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Firestore: horarios · valida janela temporal</text>
  <text x="430" y="509" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle" fill="#16a34a">entrada −30min / saída +30min</text>

  <path d="M 430 516 L 430 530" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Step 9: Firebase registra presença -->
  <rect x="280" y="530" width="300" height="44" rx="10" fill="white" stroke="#ea580c" stroke-width="2.5" filter="url(#sh)"/>
  <rect x="280" y="530" width="300" height="44" rx="10" fill="#ea580c" opacity="0.12"/>
  <rect x="280" y="530" width="6" height="44" rx="3" fill="#ea580c"/>
  <text x="430" y="549" font-family="system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#c2410c">☁️  Firebase — presencas + diario</text>
  <text x="430" y="565" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Salva presença · Atualiza Diário Digital ✅</text>

  <!-- Side labels -->
  <text x="258" y="77" font-family="system-ui,sans-serif" font-size="9" text-anchor="end" fill="#94a3b8">①</text>
  <text x="258" y="135" font-family="system-ui,sans-serif" font-size="9" text-anchor="end" fill="#94a3b8">②</text>
  <text x="258" y="193" font-family="system-ui,sans-serif" font-size="9" text-anchor="end" fill="#94a3b8">③</text>
  <text x="258" y="251" font-family="system-ui,sans-serif" font-size="9" text-anchor="end" fill="#94a3b8">④</text>
  <text x="258" y="309" font-family="system-ui,sans-serif" font-size="9" text-anchor="end" fill="#94a3b8">⑤</text>
  <text x="258" y="367" font-family="system-ui,sans-serif" font-size="9" text-anchor="end" fill="#94a3b8">⑥</text>
  <text x="258" y="425" font-family="system-ui,sans-serif" font-size="9" text-anchor="end" fill="#94a3b8">⑦</text>
  <text x="258" y="490" font-family="system-ui,sans-serif" font-size="9" text-anchor="end" fill="#94a3b8">⑧</text>
  <text x="258" y="553" font-family="system-ui,sans-serif" font-size="9" text-anchor="end" fill="#94a3b8">⑨</text>
</svg>
