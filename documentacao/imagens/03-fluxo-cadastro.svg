<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" width="860" height="270">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="270" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="34" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Fluxo de Cadastro de Aluno</text>

  <!-- ======= BOX 1: Dados ======= -->
  <rect x="20" y="54" width="116" height="86" rx="10" fill="white" stroke="#6366f1" stroke-width="2" filter="url(#sh)"/>
  <rect x="20" y="54" width="116" height="26" rx="10" fill="#6366f1"/>
  <rect x="20" y="68" width="116" height="12" fill="#6366f1"/>
  <text x="78" y="70" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="white">Operador</text>
  <text x="78" y="95" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle" fill="#4338ca">nome · matrícula</text>
  <text x="78" y="110" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle" fill="#4338ca">turma · perfil</text>
  <text x="78" y="126" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle" fill="#64748b">formulário</text>

  <!-- Arrow 1 -->
  <path d="M 136 97 L 168 97" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- ======= BOX 2: Captura (decision split) ======= -->
  <!-- Main box for the two sub-options -->
  <rect x="168" y="54" width="150" height="86" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2" filter="url(#sh)"/>
  <rect x="168" y="54" width="150" height="26" rx="10" fill="#8b5cf6"/>
  <rect x="168" y="68" width="150" height="12" fill="#8b5cf6"/>
  <text x="243" y="70" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="white">Captura de Foto</text>
  <line x1="168" y1="110" x2="318" y2="110" stroke="#e9d5ff" stroke-width="1"/>
  <text x="243" y="96" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle" fill="#6d28d9">📷 Webcam (5 fotos)</text>
  <text x="209" y="107" font-family="system-ui,sans-serif" font-size="8" text-anchor="middle" fill="#94a3b8">ou</text>
  <text x="243" y="127" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle" fill="#6d28d9">📁 Upload de imagens</text>

  <!-- Arrow 2 -->
  <path d="M 318 97 L 352 97" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- ======= BOX 3: Backend ======= -->
  <rect x="352" y="54" width="126" height="86" rx="10" fill="white" stroke="#16a34a" stroke-width="2" filter="url(#sh)"/>
  <rect x="352" y="54" width="126" height="26" rx="10" fill="#16a34a"/>
  <rect x="352" y="68" width="126" height="12" fill="#16a34a"/>
  <text x="415" y="70" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="white">Backend</text>
  <text x="415" y="95" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle" fill="#166534">POST /api/alunos</text>
  <text x="415" y="110" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle" fill="#166534">Firestore: alunos</text>
  <text x="415" y="126" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle" fill="#64748b">Node.js :3000</text>

  <!-- Arrow 3 -->
  <path d="M 478 97 L 512 97" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- ======= BOX 4: API Enroll ======= -->
  <rect x="512" y="54" width="126" height="86" rx="10" fill="white" stroke="#f59e0b" stroke-width="2" filter="url(#sh)"/>
  <rect x="512" y="54" width="126" height="26" rx="10" fill="#f59e0b"/>
  <rect x="512" y="68" width="126" height="12" fill="#f59e0b"/>
  <text x="575" y="70" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="white">API Facial</text>
  <text x="575" y="95" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle" fill="#78350f">POST /enroll</text>
  <text x="575" y="110" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle" fill="#78350f">InsightFace detecta</text>
  <text x="575" y="126" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle" fill="#64748b">FastAPI :8000</text>

  <!-- ======= DECISION: rosto? ======= -->
  <path d="M 638 97 L 672 97" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <polygon points="703,72 740,97 703,122 666,97" fill="white" stroke="#6b7280" stroke-width="2" filter="url(#sh)"/>
  <text x="703" y="93" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle" fill="#374151">Rosto</text>
  <text x="703" y="105" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle" fill="#374151">detectado?</text>

  <!-- Arrow Sim (right) -->
  <path d="M 740 97 L 774 97" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arr-g)"/>
  <text x="757" y="91" font-family="system-ui,sans-serif" font-size="8.5" text-anchor="middle" fill="#16a34a">Sim</text>

  <!-- ======= BOX 5: Embedding ======= -->
  <rect x="774" y="54" width="66" height="86" rx="10" fill="white" stroke="#f59e0b" stroke-width="2" filter="url(#sh)"/>
  <rect x="774" y="54" width="66" height="26" rx="10" fill="#b45309"/>
  <rect x="774" y="68" width="66" height="12" fill="#b45309"/>
  <text x="807" y="70" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="white">Embedding</text>
  <text x="807" y="95" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle" fill="#78350f">512-dim</text>
  <text x="807" y="110" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle" fill="#78350f">Firestore</text>
  <text x="807" y="125" font-family="system-ui,sans-serif" font-size="8.5" text-anchor="middle" fill="#64748b">API Facial</text>

  <!-- Não arrow (down from decision) -->
  <path d="M 703 122 L 703 160" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-r)"/>
  <text x="715" y="144" font-family="system-ui,sans-serif" font-size="8.5" fill="#dc2626">Não</text>

  <!-- Nao box -->
  <rect x="638" y="160" width="130" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="703" y="178" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle" fill="#991b1b">❌  Imagem rejeitada</text>
  <text x="703" y="192" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle" fill="#b91c1c">operador tenta novamente</text>

  <!-- Success box at end -->
  <rect x="774" y="160" width="66" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="807" y="178" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle" fill="#15803d">✅</text>
  <text x="807" y="193" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle" fill="#166534">Cadastrado</text>
  <!-- Arrow embedding down to success -->
  <path d="M 807 140 L 807 160" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arr-g)"/>

  <!-- Footer note -->
  <text x="430" y="252" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle" fill="#94a3b8">Cada imagem é processada individualmente pelo /enroll. Embeddings 512-dim armazenados no Firestore (coleção alunos).</text>
</svg>
