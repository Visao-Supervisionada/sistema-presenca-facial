<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arr-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="300" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="34" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Arquitetura dos Serviços — SRGFA v2.0</text>

  <!-- Docker badge -->
  <rect x="700" y="18" width="140" height="24" rx="12" fill="#0ea5e920"/>
  <text x="770" y="35" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle" fill="#0369a1" font-weight="600">🐳  Docker Compose</text>

  <!-- ======= FRONTEND BOX ======= -->
  <rect x="30" y="58" width="168" height="116" rx="12" fill="white" stroke="#3b82f6" stroke-width="2.5" filter="url(#sh)"/>
  <rect x="30" y="58" width="168" height="38" rx="12" fill="#3b82f6"/>
  <rect x="30" y="84" width="168" height="12" fill="#3b82f6"/>
  <text x="114" y="82" font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="white">Frontend</text>
  <text x="114" y="112" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle" fill="#1e40af">React 19 · Vite 6</text>
  <text x="114" y="128" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle" fill="#1e40af">Tailwind · Recharts</text>
  <text x="114" y="146" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle" fill="#64748b">Porta 5173</text>

  <!-- Arrow Frontend → Backend -->
  <path d="M 198 116 L 252 116" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="225" y="109" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle" fill="#6b7280">HTTP REST</text>

  <!-- ======= BACKEND BOX ======= -->
  <rect x="252" y="58" width="168" height="116" rx="12" fill="white" stroke="#16a34a" stroke-width="2.5" filter="url(#sh)"/>
  <rect x="252" y="58" width="168" height="38" rx="12" fill="#16a34a"/>
  <rect x="252" y="84" width="168" height="12" fill="#16a34a"/>
  <text x="336" y="82" font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="white">Backend</text>
  <text x="336" y="112" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle" fill="#166534">Node.js · Express</text>
  <text x="336" y="128" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle" fill="#166534">TypeScript · node-cron</text>
  <text x="336" y="146" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle" fill="#64748b">Porta 3000</text>

  <!-- Arrow Backend → API -->
  <path d="M 420 116 L 474 116" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="447" y="109" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle" fill="#6b7280">HTTP REST</text>

  <!-- ======= API FACIAL BOX ======= -->
  <rect x="474" y="58" width="168" height="116" rx="12" fill="white" stroke="#f59e0b" stroke-width="2.5" filter="url(#sh)"/>
  <rect x="474" y="58" width="168" height="38" rx="12" fill="#f59e0b"/>
  <rect x="474" y="84" width="168" height="12" fill="#f59e0b"/>
  <text x="558" y="82" font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="white">API Facial</text>
  <text x="558" y="112" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle" fill="#78350f">FastAPI · Python</text>
  <text x="558" y="128" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle" fill="#78350f">InsightFace buffalo_l</text>
  <text x="558" y="146" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle" fill="#64748b">Porta 8000</text>

  <!-- ======= FIREBASE BOX ======= -->
  <rect x="222" y="218" width="390" height="66" rx="12" fill="white" stroke="#ea580c" stroke-width="2.5" filter="url(#sh)"/>
  <rect x="222" y="218" width="390" height="32" rx="12" fill="#ea580c"/>
  <rect x="222" y="238" width="390" height="12" fill="#ea580c"/>
  <text x="417" y="239" font-family="system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="white">Firebase Firestore  ·  Google Cloud</text>
  <text x="417" y="259" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle" fill="#9a3412">alunos · horarios · presencas · diario · avaliacoes · notas · justificativas</text>
  <text x="417" y="275" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle" fill="#64748b">Acesso via Firebase Admin SDK (conta de serviço)</text>

  <!-- Arrow Backend ↔ Firebase -->
  <path d="M 326 174 L 344 218" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6,3" fill="none" marker-end="url(#arr-o)"/>
  <path d="M 350 218 L 332 174" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6,3" fill="none" marker-end="url(#arr-o)"/>
  <text x="310" y="198" font-family="system-ui,sans-serif" font-size="9" text-anchor="end" fill="#ea580c">Admin SDK</text>

  <!-- Arrow API ↔ Firebase -->
  <path d="M 550 174 L 518 218" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6,3" fill="none" marker-end="url(#arr-o)"/>
  <path d="M 524 218 L 556 174" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6,3" fill="none" marker-end="url(#arr-o)"/>
  <text x="566" y="198" font-family="system-ui,sans-serif" font-size="9" text-anchor="start" fill="#ea580c">Admin SDK</text>

  <!-- ======= LEGEND ======= -->
  <rect x="692" y="58" width="148" height="110" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="766" y="78" font-family="system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#374151">Legenda</text>
  <line x1="706" y1="92" x2="736" y2="92" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="744" y="96" font-family="system-ui,sans-serif" font-size="9.5" fill="#6b7280">Chamada REST</text>
  <line x1="706" y1="112" x2="736" y2="112" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-o)"/>
  <text x="744" y="116" font-family="system-ui,sans-serif" font-size="9.5" fill="#ea580c">Admin SDK</text>
  <rect x="706" y="127" width="11" height="11" rx="2" fill="#3b82f6"/>
  <text x="723" y="137" font-family="system-ui,sans-serif" font-size="9" fill="#374151">Frontend</text>
  <rect x="706" y="143" width="11" height="11" rx="2" fill="#16a34a"/>
  <text x="723" y="153" font-family="system-ui,sans-serif" font-size="9" fill="#374151">Backend</text>
  <rect x="706" y="159" width="11" height="11" rx="2" fill="#f59e0b"/>
  <text x="723" y="169" font-family="system-ui,sans-serif" font-size="9" fill="#374151">API Facial</text>
</svg>
